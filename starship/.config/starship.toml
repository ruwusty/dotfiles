"$schema" = 'https://starship.rs/config-schema.json'

palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
mauve = "#cba6f7"
red = "#f38ba8"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext0 = "#a6adc8"
overlay0 = "#6c7086"

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$cmd_duration
$character"""

[directory]
style = "blue bold"
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = true

[git_branch]
style = "mauve bold"
format = "[$symbol$branch]($style) "
symbol = " "

[git_status]
style = "peach"
format = "[$all_status$ahead_behind]($style) "

[character]
success_symbol = "[❯](green bold)"
error_symbol = "[❯](red bold)"
vimcmd_symbol = "[❮](green bold)"

[cmd_duration]
style = "yellow"
format = "[$duration]($style) "

[nodejs]
symbol = " "
style = "green bold"

[python]
symbol = " "
style = "yellow bold"

[rust]
symbol = " "
style = "peach bold"
